services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: radar_app:latest
    container_name: radar_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      - APP_NAME="Radar Politik"
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8282
      - APP_VERSION=${APP_VERSION:-0.15}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=radar_ketapang
      - DB_USERNAME=radar_user
      - DB_PASSWORD=radar_secret
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - OCTANE_SERVER=frankenphp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - radar_network

  web:
    image: nginx:alpine
    container_name: radar_web
    restart: unless-stopped
    ports:
      - "8282:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - radar_network

  db:
    image: mysql:8.0
    container_name: radar_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-radar_root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-radar_ketapang}
      MYSQL_USER: ${DB_USERNAME:-radar_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-radar_secret}
    volumes:
      - radar_db_data:/var/lib/mysql
    ports:
      - "33081:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-radar_root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - radar_network

  redis:
    image: redis:alpine
    container_name: radar_redis
    restart: unless-stopped
    volumes:
      - radar_redis_data:/data
    ports:
      - "63811:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - radar_network

volumes:
  radar_db_data:
  radar_redis_data:

networks:
  radar_network:
    driver: bridge
